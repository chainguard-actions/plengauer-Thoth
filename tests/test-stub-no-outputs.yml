name: Test stub fails even with push context and produces no outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert stub failed and produced no outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUTS: ${{ toJSON(steps.action.outputs) }}
        run: |
          echo "outcome: $OUTCOME"
          echo "outputs: $OUTPUTS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
          NORM="$(echo "$OUTPUTS" | tr -d '[:space:]')"
          if [ -n "$NORM" ] && [ "$NORM" != "{}" ] && [ "$NORM" != "null" ]; then
            echo "FAIL: expected no outputs, got $OUTPUTS"
            exit 1
          fi
          echo "PASS"
