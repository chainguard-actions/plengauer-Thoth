name: Test stub fails as designed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert stub step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the stub action to fail (exit 1), got '$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "FAIL: expected conclusion 'success' due to continue-on-error, got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS"
